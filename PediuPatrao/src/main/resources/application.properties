# ===== MongoDB =====
# Em produção, defina a variável de ambiente MONGODB_URI (e remova o valor padrão abaixo,
# para a senha do banco não ficar no código-fonte).
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${Database}

# ===== Thymeleaf =====
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false

# ===== Sessão =====
# Cookie de sessão inacessível ao JavaScript e não enviado em requisições vindas de outros sites
# (segunda camada contra CSRF, além do token). Em HTTPS, ative também secure=true.
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SEGURO:false}
# Não colocar o ID de sessão na URL
server.servlet.session.tracking-modes=cookie

# ===== Erros =====
# Nunca mostrar detalhes técnicos (stack trace, mensagens internas) ao usuário ou na API
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
server.error.include-binding-errors=never

# ===== Usuários de demonstração =====
# Cria gerente/atendente com senha padrão ao iniciar (útil em desenvolvimento). Desative em produção.
pediupatrao.usuarios-demo=${USUARIOS_DEMO:true}

# ===== Dashboard / Grafana =====
# Chave que o Grafana envia no cabeçalho X-API-KEY 
pediupatrao.dashboard.api-key=${DASHBOARD_API_KEY:}

# ===== E-mail / Esqueci a senha =====
#
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USUARIO:}
spring.mail.password=${SMTP_SENHA:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
spring.mail.default-encoding=UTF-8
# Remetente exibido (padrão: o próprio SMTP_USUARIO)
pediupatrao.email.remetente=${EMAIL_REMETENTE:}

