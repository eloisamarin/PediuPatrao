<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Nova senha</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
    <style>
        .login-container { display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #f8f9fa; padding: 16px; }
        .login-card { max-width: 420px; width: 100%; padding: 2rem; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2); border-radius: 8px; background-color: #ffffff; }
        .logo { width: 90px; height: auto; margin-bottom: 1rem; }
    </style>
</head>
<body>
<div class="login-container">
    <div class="login-card">
        <div class="text-center">
            <img th:src="@{/images/logo.png}" alt="Logo" class="logo">
            <h4 class="mb-3">Criar nova senha</h4>
        </div>

        <!-- Link inválido, expirado ou já usado -->
        <div th:unless="${valido}">
            <div class="alert alert-warning">
                Este link é inválido, já foi usado ou expirou (ele vale por 30 minutos).
            </div>
            <a th:href="@{/esqueci-senha}" class="btn btn-primary w-100">Pedir um novo link</a>
        </div>

        <div th:if="${valido}">
            <div class="alert alert-danger py-2" th:if="${erro}" th:text="${erro}"></div>

            <form th:action="@{/redefinir-senha}" method="post">
                <input type="hidden" name="token" th:value="${token}">
                <div class="mb-3">
                    <label for="senha" class="form-label">Nova senha</label>
                    <input type="password" class="form-control" id="senha" name="senha"
                           minlength="8" maxlength="72" autocomplete="new-password" required autofocus>
                    <div class="form-text">8 a 72 caracteres, com letras e números.</div>
                </div>
                <div class="mb-3">
                    <label for="confirmacao" class="form-label">Confirme a nova senha</label>
                    <input type="password" class="form-control" id="confirmacao" name="confirmacao"
                           minlength="8" maxlength="72" autocomplete="new-password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Salvar nova senha</button>
            </form>
        </div>

        <div class="mt-3 text-center">
            <a th:href="@{/login}" class="text-decoration-none">&larr; Voltar para o login</a>
        </div>
    </div>
</div>
</body>
</html>
